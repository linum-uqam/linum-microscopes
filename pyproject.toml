[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linum_microscopes"
version = "2025.02.01b1"
dependencies = [
    "numpy",
    "pyside6",
    "pyqtgraph",
    "PyQtDarkTheme",
    "pyserial",
    "tomli",
    "tqdm"
]
requires-python = ">= 3.10"
authors = [
  {name = "Joel Lefebvre", email = "lefebvre.joel@uqam.ca"},
  {name = "Frans Irgolitsch", email = "frans.irgolitsch@polymtl.ca"}
]
description = "Linum Microscopes contains the main GUI and framework for the different microscopes of LINUM."
readme = "README.md"
license = {file = "LICENSE"}

